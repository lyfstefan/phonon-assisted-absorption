[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonon-assisted-absorption"
version = "0.2.0"
description = "Stable polaron absorption models and bounded fixed-energy fitting"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yifan Liu"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
phonon-absorption = "phonon_absorption.cli:main"

[tool.setuptools.packages.find]
include = ["phonon_absorption*"]
